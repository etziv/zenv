[package]
name = "zenv-native"
version = "1.0.0"
description = "Zenv desktop UI in pure Rust (egui), replacing the Tauri + React shell"
edition = "2021"
rust-version = "1.85"
workspace = "../src-tauri"

[[bin]]
name = "zenv-native"
path = "src/main.rs"

[dependencies]
zenv-core = { path = "../src-tauri/core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "default_fonts", "persistence", "clipboard", "links"] }
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
rfd = "0.18"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tracing = "0.1"
tray-icon = { version = "0.25.1", default-features = false }
alacritty_terminal = "0.26"
arboard = "3.7"
fancy-regex = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
