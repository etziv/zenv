; OPcache production tuning untuk Laravel Filament.
; File ini di-COPY ke /usr/local/etc/php/conf.d/opcache.ini di Dockerfile.

opcache.enable=1

; Memory yang dialokasikan untuk opcode cache. 256MB cukup untuk most Laravel
; apps dengan Filament. Naikkan kalau ada warning "out of memory" di log PHP.
opcache.memory_consumption=256

; Buffer untuk interned strings (string yang sering diakses di-cache).
opcache.interned_strings_buffer=16

; Maximum jumlah file yang di-cache. Naikkan kalau project besar.
; Cek pakai: php -r 'print_r(opcache_get_status()["opcache_statistics"]);'
opcache.max_accelerated_files=20000

; Mode BIND-MOUNT / live-sync: source di-bind-mount (bukan di-COPY ke image),
; jadi OPcache HARUS cek perubahan file. validate_timestamps=1 + revalidate_freq=2
; = cek mtime tiap <=2 detik. Karena FrankenPHP php-server fresh boot per request
; (BUKAN Octane), edit kode PHP langsung kepakai <=2 detik TANPA rebuild & TANPA
; restart container. Overhead stat kecil, layak ditukar deploy tanpa build.
; (Kalau balik ke pola COPY-source-in-image, set validate_timestamps=0.)
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Fast shutdown - skip cleanup yang gak perlu saat request selesai.
