# docker-compose.yml - Laravel + Inertia + React, dengan Reverb (websocket).
# Ganti semua "myapp" dengan slug project. context = lokasi source code.
#
# ============================================================================
# KONFIG ENV (deploy.sh v2, zero-downtime): service app TIDAK memakai env_file.
# Laravel membaca /app/.env langsung (file yang sama, lewat bind-mount), jadi
# ganti nilai .env cukup refresh config cache - TANPA recreate container.
# Kalau env_file dipakai, nilai di environment container MENANG atas .env
# (Dotenv immutable) sehingga config:cache tetap membaca nilai lama sampai
# container di-recreate. Block `environment:` di bawah hanya untuk var
# kontrol (RUN_*) dan topologi tetap; nilainya menang atas .env.
# ${...} di file ini (port, build args) tetap dibaca dari --env-file saat
# compose di-parse; mengubahnya = compose recreate service itu saja.
# Catatan: kode yang memakai getenv() langsung (bukan env()/config()) tidak
# melihat isi .env; pakai config() di aplikasi.
#
# BIND-MOUNT SOURCE: /app di-mount dari ${SRC_DIR} server (di-set deploy.sh) ->
# update kode langsung live tanpa rebuild. storage & bootstrap/cache tetap
# NAMED VOLUME (persisten, tak ketiban bind; file cache/session inertia di sini).
# Octane menahan kode di worker -> deploy.sh jalankan `octane:reload` biar kode
# baru kepakai (set OCTANE=1 di deploy.sh). Pasangkan opcache.validate_timestamps=1.
# ============================================================================
x-app-volumes: &app-volumes
    - type: bind
      source: ${SRC_DIR:-..}
      target: /app
    - app-storage:/app/storage
    - app-bootstrap-cache:/app/bootstrap/cache

services:
    app:
        build:
            # context = lokasi source. Default ".." (compose di docker/),
            # di server di-override lewat BUILD_CONTEXT (di-set deploy.sh).
            context: ${BUILD_CONTEXT:-..}
            dockerfile: docker/Dockerfile
            args:
                CACHEBUST: ${CACHEBUST:-1}
                VITE_APP_NAME: ${APP_NAME:-MyApp}
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8090}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        image: myapp:latest
        container_name: myapp-app
        restart: unless-stopped
        ports:
            # Docker publishes around ufw: APP_BIND in .env IS the firewall (LAN IP users open, or loopback).
            - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
        environment:
            # Topologi tetap (override .env) - inertia pakai file cache + reverb.
            CACHE_STORE: file
            SESSION_DRIVER: file
            QUEUE_CONNECTION: sync
            BROADCAST_CONNECTION: reverb
            REVERB_HOST: reverb          # DNS container reverb (bukan IP browser)
            REVERB_PORT: 8090
            REVERB_SCHEME: http
            OCTANE_SERVER: frankenphp
            RUN_MIGRATIONS: "true"
        volumes: *app-volumes
        # Healthcheck bawaan image FrankenPHP (curl :2019/metrics) selalu gagal
        # di mode Octane (admin Caddy tak aktif) -> container tampak "unhealthy".
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/up || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        depends_on:
            mysql:
                condition: service_healthy
                required: false
        networks:
            - myapp

    scheduler:
        image: myapp:latest
        container_name: myapp-scheduler
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]
        environment:
            CACHE_STORE: file
            SESSION_DRIVER: file
            RUN_MIGRATIONS: "false"
        volumes: *app-volumes
        healthcheck:
            # Tak punya port -> cukup pastikan proses schedule:work hidup.
            test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        depends_on:
            app:
                condition: service_started
        networks:
            - myapp

    reverb:
        image: myapp:latest
        container_name: myapp-reverb
        restart: unless-stopped
        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8090"]
        ports:
            - "${APP_BIND:-127.0.0.1}:${REVERB_PORT:-8090}:8090"
        environment:
            CACHE_STORE: file
            SESSION_DRIVER: file
            BROADCAST_CONNECTION: reverb
            REVERB_HOST: 0.0.0.0
            REVERB_PORT: 8090
            RUN_MIGRATIONS: "false"
        volumes: *app-volumes
        healthcheck:
            # Tanpa -f: Reverb menjawab 404 di "/" = server hidup.
            test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8090/ || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        depends_on:
            app:
                condition: service_started
        networks:
            - myapp

    # MySQL internal - opsional. Aktifkan: docker compose --profile internal-db up
    # Kalau pakai DB eksternal, biarkan (service ini idle tanpa profile).
    # NB: environment: di sini untuk image mysql (bukan app), di-interpolasi
    # dari --env-file saat parse compose - biarkan apa adanya.
    mysql:
        # 8.4 LTS (8.0 is end of life since 2026-04); mysql_native_password is off by default in 8.4
        image: mysql:8.4
        container_name: myapp-mysql
        restart: unless-stopped
        profiles: ["internal-db"]
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-myapp}
            MYSQL_USER: ${DB_USERNAME:-myapp}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
        ports:
            - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"   # loopback only: Docker bypasses ufw
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - myapp

volumes:
    mysql-data:
    app-storage:
    app-bootstrap-cache:

networks:
    myapp:
        driver: bridge
