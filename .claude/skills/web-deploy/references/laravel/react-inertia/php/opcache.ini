; OPcache tuning untuk Laravel + Octane (FrankenPHP) mode BIND-MOUNT.
; File ini di-COPY ke /usr/local/etc/php/conf.d/opcache.ini di Dockerfile.

opcache.enable=1

; Memory opcode cache. 256MB cukup untuk kebanyakan app Laravel.
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Mode BIND-MOUNT + Octane: source di-bind-mount (bukan di-COPY ke image).
; validate_timestamps=1 WAJIB di sini -> setelah `octane:reload`, worker BARU
; harus baca bytecode fresh dari file yang berubah. Kalau =0, opcache (shared
; memory) tetap serve bytecode lama meski worker sudah reload -> kode basi.
; Perubahan kode baru kepakai setelah deploy.sh menjalankan `octane:reload`.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

